<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d3b2a">
<title>Pool-turnering</title>
<style>
  :root {
    --felt: #0d3b2a;
    --felt-2: #12503a;
    --bg: #0a2219;
    --card: #133a2c;
    --card-2: #1a4a38;
    --text: #eef6f1;
    --muted: #9fbfb0;
    --accent: #f2c14e;
    --win: #5fd38d;
    --loss: #ef7d7d;
    --line: #2a5a47;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  header {
    background: linear-gradient(180deg, var(--felt-2), var(--felt));
    padding: 16px 16px 0;
    position: sticky; top: 0; z-index: 10;
    box-shadow: 0 2px 8px rgba(0,0,0,.35);
  }
  h1 { margin: 0 0 4px; font-size: 1.35rem; display: flex; align-items: center; gap: 10px; }
  .ball {
    width: 28px; height: 28px; border-radius: 50%; background: #111; color: #111;
    display: inline-grid; place-items: center; font-size: .75rem; font-weight: 800;
    box-shadow: inset -4px -4px 8px rgba(255,255,255,.12);
  }
  .ball span { background: #fff; border-radius: 50%; width: 14px; height: 14px; display: grid; place-items: center; }
  .sub { color: var(--muted); font-size: .85rem; margin-bottom: 10px; }
  nav { display: flex; gap: 4px; overflow-x: auto; }
  nav button {
    flex: 1; min-width: 80px; background: none; border: 0; color: var(--muted);
    padding: 10px 8px 12px; font-size: .95rem; font-weight: 600; cursor: pointer;
    border-bottom: 3px solid transparent;
  }
  nav button.active { color: var(--accent); border-bottom-color: var(--accent); }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  h2 { font-size: 1.1rem; margin: 22px 0 10px; }
  h2:first-child { margin-top: 4px; }
  .card { background: var(--card); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
  .muted { color: var(--muted); }
  .small { font-size: .85rem; }
  button.btn, .btn {
    background: var(--accent); color: #1b1b1b; border: 0; border-radius: 10px;
    padding: 11px 16px; font-size: 1rem; font-weight: 700; cursor: pointer;
  }
  .btn.secondary { background: var(--card-2); color: var(--text); }
  .btn.danger { background: #7a2a2a; color: #fff; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=text], input[type=number], select {
    background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px; font-size: 1rem; width: 100%;
  }
  label { display: block; font-size: .85rem; color: var(--muted); margin: 10px 0 4px; }
  .players-input { display: grid; gap: 8px; }
  .players-input .row input { flex: 1; }
  .icon-btn { background: var(--card-2); color: var(--text); border: 0; border-radius: 8px; width: 42px; height: 42px; font-size: 1.1rem; cursor: pointer; }

  /* Game modes */
  .modes { display: grid; gap: 8px; }
  .mode-opt {
    display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center;
    background: var(--bg); border: 2px solid var(--line); border-radius: 10px;
    padding: 12px; margin: 0; cursor: pointer; color: var(--text);
  }
  .mode-opt:has(input:checked) { border-color: var(--accent); }
  .mode-opt.disabled { opacity: .45; cursor: not-allowed; }
  .mode-opt input { margin: 0; accent-color: var(--accent); width: 18px; height: 18px; }
  .mode-opt .t { font-weight: 700; font-size: 1rem; }
  .mode-opt .d { grid-column: 2 / -1; color: var(--muted); font-size: .85rem; }
  .mode-opt .n { font-weight: 800; color: var(--accent); font-size: .9rem; white-space: nowrap; }
  .summary { margin-top: 14px; padding: 10px 12px; border-radius: 10px; background: var(--card-2); font-size: .9rem; }

  /* Matches */
  .round-title { display: flex; justify-content: space-between; align-items: baseline; }
  .group-label { font-size: .75rem; text-transform: uppercase; color: var(--accent); letter-spacing: .04em; margin: 10px 0 0; font-weight: 700; }
  .match {
    display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center;
    padding: 10px 0;
  }
  .match + .match { border-top: 1px solid var(--line); }
  .match .note { grid-column: 1 / -1; text-align: center; font-size: .75rem; color: var(--muted); margin-bottom: -4px; }
  .match .p { font-weight: 600; overflow-wrap: anywhere; }
  .match .p.a { text-align: right; }
  .match .p.win { color: var(--win); }
  .match .p.lose { color: var(--muted); font-weight: 500; }
  .score {
    display: flex; align-items: center; gap: 6px; background: var(--bg);
    border-radius: 10px; padding: 6px 10px; font-variant-numeric: tabular-nums;
    font-weight: 800; font-size: 1.15rem; min-width: 84px; justify-content: center;
    cursor: pointer; border: 1px solid var(--line);
  }
  .score.pending { color: var(--muted); font-weight: 600; font-size: .9rem; }
  .score.static { cursor: default; border-style: dashed; }
  .bye { font-size: .85rem; color: var(--muted); margin-top: 6px; }
  .done-badge { font-size: .75rem; color: var(--win); font-weight: 700; }

  /* Table */
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 9px 6px; text-align: center; }
  th { color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .03em; font-weight: 600; }
  td.name, th.name { text-align: left; }
  tbody tr { border-top: 1px solid var(--line); }
  tbody tr.top4 td.pos { color: var(--accent); font-weight: 800; }
  td.pts { font-weight: 800; color: var(--accent); }
  .form { display: inline-flex; gap: 3px; }
  .form i { width: 16px; height: 16px; border-radius: 4px; font-style: normal; font-size: .65rem; font-weight: 800; display: grid; place-items: center; color: #102; }
  .form i.W { background: var(--win); }
  .form i.L { background: var(--loss); }
  @media (max-width: 520px) { .hide-sm { display: none; } th, td { padding: 8px 3px; } }

  /* Bracket */
  .bracket { display: grid; gap: 12px; }
  .bm-label { font-size: .75rem; text-transform: uppercase; color: var(--muted); letter-spacing: .04em; margin-bottom: 4px; }
  .champion {
    text-align: center; padding: 22px 14px; border-radius: var(--radius);
    background: radial-gradient(circle at 50% 0%, #3d5c22, var(--card));
    border: 2px solid var(--accent);
  }
  .champion .trophy { font-size: 2.6rem; }
  .champion .who { font-size: 1.5rem; font-weight: 800; color: var(--accent); margin-top: 4px; }

  /* Modal */
  dialog {
    border: 0; border-radius: 16px; padding: 0; background: var(--card); color: var(--text);
    width: min(420px, calc(100vw - 32px));
  }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  .modal-body { padding: 18px; }
  .modal-body h3 { margin: 0 0 4px; }
  .scorer { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
  .side { background: var(--bg); border-radius: 12px; padding: 12px; text-align: center; }
  .side .nm { font-weight: 700; margin-bottom: 8px; overflow-wrap: anywhere; min-height: 1.3em; }
  .side .val { font-size: 2.6rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .side .ctl { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }
  .side .ctl button { width: 48px; height: 48px; font-size: 1.4rem; border-radius: 10px; border: 0; background: var(--card-2); color: var(--text); cursor: pointer; }
  .side.leading .val { color: var(--win); }
  .hint { font-size: .85rem; color: var(--muted); min-height: 1.2em; }
  .modal-actions { display: flex; gap: 8px; justify-content: space-between; margin-top: 14px; flex-wrap: wrap; }
  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    background: #000c; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: .9rem;
    opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50;
  }
  .toast.show { opacity: 1; }
  .progress { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .progress div { height: 100%; background: var(--accent); }
</style>
</head>
<body>
<header>
  <h1><span class="ball"><span>8</span></span><span id="title">Pool-turnering</span></h1>
  <div class="sub" id="subtitle"></div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>

<dialog id="scoreDialog">
  <div class="modal-body">
    <h3 id="dlgTitle">Indtast resultat</h3>
    <div class="muted small" id="dlgSub"></div>
    <div class="scorer">
      <div class="side" id="sideA">
        <div class="nm" id="nmA"></div>
        <div class="val" id="valA">0</div>
        <div class="ctl"><button type="button" data-side="a" data-d="-1">−</button><button type="button" data-side="a" data-d="1">+</button></div>
      </div>
      <div class="side" id="sideB">
        <div class="nm" id="nmB"></div>
        <div class="val" id="valB">0</div>
        <div class="ctl"><button type="button" data-side="b" data-d="-1">−</button><button type="button" data-side="b" data-d="1">+</button></div>
      </div>
    </div>
    <div class="hint" id="dlgHint"></div>
    <div class="modal-actions">
      <button class="btn danger" id="dlgClear" type="button">Nulstil kamp</button>
      <div class="row">
        <button class="btn secondary" id="dlgCancel" type="button">Annuller</button>
        <button class="btn" id="dlgSave" type="button">Gem</button>
      </div>
    </div>
  </div>
</dialog>

<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(() => {
  const STORAGE_KEY = 'pool-turnering-v1';
  const DEFAULT_NAMES = ['', '', '', '', '', '', ''];
  const BYE = '__bye';

  const MODES = {
    league: { name: 'Alle mod alle', desc: 'Alle møder alle én gang. Mest retfærdigt, men flest kampe.' },
    groups: { name: 'Gruppespil', desc: 'To grupper, alle mod alle i gruppen. De bedste fra hver gruppe går i slutspil.' },
    knockout: { name: 'Knockout', desc: 'Taber man, er man ude. Hurtigst – lodtrækning afgør, hvem der møder hvem.' },
  };

  // ---------- State ----------
  let state = migrate(load());
  let tab = state ? 'program' : 'setup';

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch { return null; }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch { toast('Kunne ikke gemme – eksportér en backup!'); }
  }

  // Bring tournaments saved by older versions of the app up to date.
  function migrate(s) {
    if (!s) return s;
    s.mode = s.mode || 'league';
    s.rounds = (s.rounds || []).map(r => ({ matches: r.matches, byes: r.byes || (r.bye ? [r.bye] : []) }));
    if (s.playoff && !s.bracket) {
      const po = s.playoff;
      s.bracket = { rounds: po.semis.length ? [po.semis, [po.final]] : [[po.final]], bronze: po.bronze || null };
    }
    delete s.playoff;
    if (s.bracket === undefined) s.bracket = null;
    return s;
  }

  const uid = () => Math.random().toString(36).slice(2, 10);
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const mk = (a, b, extra) => ({ id: uid(), a, b, sa: null, sb: null, ...extra });

  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove('show'), 2200);
  }

  // ---------- Tournament logic ----------
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Round robin via the circle method. Odd player counts get a bye each round.
  function makeSchedule(ids, extra) {
    const list = shuffle(ids);
    if (list.length % 2) list.push(null);
    const n = list.length;
    const rounds = [];
    let arr = list.slice();
    for (let r = 0; r < n - 1; r++) {
      const matches = [];
      const byes = [];
      for (let i = 0; i < n / 2; i++) {
        let a = arr[i], b = arr[n - 1 - i];
        if (a === null || b === null) { byes.push(a === null ? b : a); continue; }
        if (r % 2 === 1) [a, b] = [b, a]; // vary who's listed first
        matches.push(mk(a, b, extra));
      }
      rounds.push({ matches: shuffle(matches), byes });
      arr = [arr[0], arr[n - 1], ...arr.slice(1, n - 1)];
    }
    return rounds;
  }

  // Two groups played side by side: round i holds round i of both groups.
  function makeGroups(ids) {
    const list = shuffle(ids);
    const half = Math.ceil(list.length / 2);
    const groups = [
      { name: 'A', players: list.slice(0, half) },
      { name: 'B', players: list.slice(half) },
    ];
    const scheds = groups.map(g => makeSchedule(g.players, { group: g.name }));
    const n = Math.max(...scheds.map(s => s.length));
    const rounds = [];
    for (let i = 0; i < n; i++) {
      rounds.push({
        matches: scheds.flatMap(s => s[i] ? s[i].matches : []),
        byes: scheds.flatMap(s => s[i] ? s[i].byes : []),
      });
    }
    return { groups, rounds };
  }

  // Single elimination. Missing spots in the bracket become byes, at most one per match.
  function makeKnockout(ids, bronzeMatch) {
    const list = shuffle(ids);
    let size = 2;
    while (size < list.length) size *= 2;
    const nMatches = size / 2;
    const byes = size - list.length;
    // Spread byes out: even slots first, then odd, so bye players rarely meet each other in round 2.
    const order = [...Array(nMatches).keys()].sort((x, y) => (x % 2) - (y % 2) || x - y);
    const byeSlots = new Set(order.slice(0, byes));
    let k = 0;
    const first = [];
    for (let i = 0; i < nMatches; i++) {
      if (byeSlots.has(i)) first.push(mk(list[k++], BYE));
      else { const a = list[k++], b = list[k++]; first.push(mk(a, b)); }
    }
    const rounds = [first];
    for (let n = nMatches / 2; n >= 1; n /= 2) rounds.push(Array.from({ length: n }, () => mk(null, null)));
    const semis = rounds.length >= 2 ? rounds[rounds.length - 2] : null;
    const bronze = bronzeMatch && semis && !semis.some(isBye) ? mk(null, null) : null;
    return { rounds, bronze };
  }

  const playerName = id => (state.players.find(p => p.id === id) || {}).name || '?';
  const isBye = m => m.b === BYE;
  const isDone = m => !!m && (isBye(m) || (m.sa !== null && m.sb !== null));
  const winnerOf = m => !isDone(m) ? null : isBye(m) ? m.a : (m.sa > m.sb ? m.a : m.b);
  const loserOf = m => !isDone(m) || isBye(m) ? null : (m.sa > m.sb ? m.b : m.a);
  const allLeagueMatches = () => state.rounds.flatMap(r => r.matches);
  const bracketMatches = () => state.bracket
    ? [...state.bracket.rounds.flat(), state.bracket.bronze].filter(Boolean)
    : [];
  const allIds = () => state.players.map(p => p.id);

  function standings(ids = allIds()) {
    const set = new Set(ids);
    const matches = allLeagueMatches().filter(m => set.has(m.a) && set.has(m.b));
    const rows = {};
    state.players.filter(p => set.has(p.id)).forEach(p =>
      rows[p.id] = { id: p.id, name: p.name, p: 0, w: 0, l: 0, ff: 0, fa: 0, form: [] });
    matches.forEach(m => {
      if (!isDone(m)) return;
      const A = rows[m.a], B = rows[m.b];
      A.p++; B.p++;
      A.ff += m.sa; A.fa += m.sb; B.ff += m.sb; B.fa += m.sa;
      if (m.sa > m.sb) { A.w++; B.l++; A.form.push('W'); B.form.push('L'); }
      else { B.w++; A.l++; B.form.push('W'); A.form.push('L'); }
    });
    const list = Object.values(rows);
    list.forEach(r => { r.diff = r.ff - r.fa; r.pts = r.w * state.pointsPerWin; });
    const h2h = (x, y) => {
      const m = matches.find(m => isDone(m) && ((m.a === x && m.b === y) || (m.a === y && m.b === x)));
      if (!m) return 0;
      return winnerOf(m) === x ? -1 : 1;
    };
    list.sort((x, y) =>
      y.pts - x.pts ||
      y.diff - x.diff ||
      y.ff - x.ff ||
      h2h(x.id, y.id) ||
      x.name.localeCompare(y.name, 'da'));
    return list;
  }

  function progress() {
    const all = state.mode === 'knockout'
      ? bracketMatches().filter(m => !isBye(m))
      : allLeagueMatches();
    return { done: all.filter(isDone).length, total: all.length };
  }

  function createPlayoff() {
    const size = state.playoffSize;
    let pairs;
    if (state.mode === 'groups') {
      const [A, B] = state.groups.map(g => standings(g.players));
      pairs = size === 4
        ? [[A[0], B[1], 'A1 vs B2'], [B[0], A[1], 'B1 vs A2']]
        : [[A[0], B[0], 'A1 vs B1']];
    } else {
      const st = standings();
      pairs = size === 4
        ? [[st[0], st[3], 'Nr. 1 vs nr. 4'], [st[1], st[2], 'Nr. 2 vs nr. 3']]
        : [[st[0], st[1], 'Nr. 1 vs nr. 2']];
    }
    const first = pairs.map(([x, y, note]) => mk(x.id, y.id, { note }));
    const rounds = [first];
    if (first.length === 2) rounds.push([mk(null, null)]);
    state.bracket = { rounds, bronze: size === 4 && state.bronzeMatch ? mk(null, null) : null };
    syncBracket();
  }

  // Move winners (and semifinal losers) on through the bracket; drop results that no longer match.
  function syncBracket() {
    const br = state.bracket;
    if (!br) return;
    const fill = (m, a, b) => {
      if (m.a !== a || m.b !== b) { m.a = a; m.b = b; m.sa = null; m.sb = null; }
    };
    for (let r = 1; r < br.rounds.length; r++) {
      br.rounds[r].forEach((m, i) => fill(m, winnerOf(br.rounds[r - 1][2 * i]), winnerOf(br.rounds[r - 1][2 * i + 1])));
    }
    if (br.bronze && br.rounds.length >= 2) {
      const semis = br.rounds[br.rounds.length - 2];
      fill(br.bronze, loserOf(semis[0]), loserOf(semis[1]));
    }
  }

  function roundLabel(r, total) {
    const d = total - 1 - r;
    return d === 0 ? 'Finale' : d === 1 ? 'Semifinaler' : d === 2 ? 'Kvartfinaler' : `Runde ${r + 1}`;
  }
  function raceFor(r, total) {
    const d = total - 1 - r;
    return d === 0 ? state.finalRaceTo : d === 1 ? state.playoffRaceTo : state.raceTo;
  }

  function findMatch(id) {
    for (const r of state.rounds) {
      const m = r.matches.find(m => m.id === id);
      if (m) return { m, raceTo: state.raceTo, ctx: m.group ? `Gruppe ${m.group}` : 'Grundspil', league: true };
    }
    const br = state.bracket;
    if (br) {
      const total = br.rounds.length;
      for (let r = 0; r < total; r++) {
        const m = br.rounds[r].find(m => m.id === id);
        if (m) return { m, raceTo: raceFor(r, total), ctx: roundLabel(r, total) };
      }
      if (br.bronze && br.bronze.id === id) return { m: br.bronze, raceTo: state.playoffRaceTo, ctx: 'Bronzekamp' };
    }
    return null;
  }

  // Number of matches each game mode gives, for the setup screen.
  function plan(mode, n, size, bronze) {
    const c2 = k => k * (k - 1) / 2;
    if (mode === 'knockout') {
      const b = bronze && n >= 4 ? 1 : 0;
      return { total: n - 1 + b, text: `${n - 1} knockout-kampe${b ? ' + bronzekamp' : ''}. Taber man, er man ude – alle får mindst 1 kamp.` };
    }
    const po = size === 4 ? 3 + (bronze ? 1 : 0) : size === 2 ? 1 : 0;
    const poText = po ? ` + ${po} i slutspillet` : '';
    if (mode === 'groups') {
      const g1 = Math.ceil(n / 2), g2 = Math.floor(n / 2);
      const gm = c2(g1) + c2(g2);
      const per = g1 === g2 ? `${g1 - 1}` : `${g2 - 1}-${g1 - 1}`;
      return { total: gm + po, text: `Grupper på ${g1} og ${g2} spillere: ${gm} gruppekampe${poText}. Hver spiller får ${per} gruppekampe.` };
    }
    return { total: c2(n) + po, text: `${c2(n)} kampe i grundspillet${poText}. Hver spiller får ${n - 1} kampe.` };
  }

  // ---------- Rendering ----------
  function tabsFor() {
    if (!state) return [['setup', 'Opsætning']];
    if (state.mode === 'knockout') return [['program', 'Turneringstræ'], ['setup', 'Opsætning']];
    return [['program', 'Kampe'], ['table', 'Stilling'], ['playoff', 'Slutspil'], ['setup', 'Opsætning']];
  }

  function render() {
    const tabs = tabsFor();
    if (!tabs.some(([k]) => k === tab)) tab = tabs[0][0];
    $('#title').textContent = state ? state.name : 'Pool-turnering';
    if (state) {
      const { done, total } = progress();
      $('#subtitle').textContent = `${state.players.length} spillere · ${MODES[state.mode].name} · ${done}/${total} kampe spillet`;
    } else {
      $('#subtitle').textContent = 'Opret en turnering for at komme i gang';
    }
    $('#nav').innerHTML = tabs
      .map(([k, l]) => `<button class="${k === tab ? 'active' : ''}" data-tab="${k}">${l}</button>`).join('');
    const main = $('#main');
    if (tab === 'program') main.innerHTML = state.mode === 'knockout' ? renderKnockout() : renderProgram();
    else if (tab === 'table') main.innerHTML = renderTable();
    else if (tab === 'playoff') main.innerHTML = renderPlayoff();
    else { main.innerHTML = renderSetup(); if (!state) updateSetup(); }
  }

  function matchRow(m, raceTo) {
    const note = m.note ? `<div class="note">${esc(m.note)}</div>` : '';
    if (isBye(m)) {
      return `<div class="match">${note}
        <div class="p a win">${esc(playerName(m.a))}</div>
        <div class="score pending static">Fri</div>
        <div class="p b muted">går direkte videre</div>
      </div>`;
    }
    const done = isDone(m);
    const w = winnerOf(m);
    const cls = id => !done ? '' : (id === w ? 'win' : 'lose');
    const an = m.a ? esc(playerName(m.a)) : '<span class="muted">?</span>';
    const bn = m.b ? esc(playerName(m.b)) : '<span class="muted">?</span>';
    const ready = m.a && m.b;
    const score = done
      ? `<span>${m.sa}</span><span class="muted">–</span><span>${m.sb}</span>`
      : (ready ? 'Indtast' : 'Venter');
    return `<div class="match">${note}
      <div class="p a ${cls(m.a)}">${an}</div>
      <div class="score ${done ? '' : 'pending'} ${ready ? '' : 'static'}" ${ready ? `data-match="${m.id}"` : ''} title="Race to ${raceTo}">${score}</div>
      <div class="p b ${cls(m.b)}">${bn}</div>
    </div>`;
  }

  function progressCard(title, text) {
    const { done, total } = progress();
    const pct = total ? Math.round(done / total * 100) : 0;
    return `<div class="card">
      <div class="row" style="justify-content:space-between">
        <strong>${title}</strong><span class="muted small">${done}/${total}</span>
      </div>
      <div class="progress"><div style="width:${pct}%"></div></div>
      <div class="muted small" style="margin-top:8px">${text}</div>
    </div>`;
  }

  function renderProgram() {
    const grouped = state.mode === 'groups';
    let html = progressCard(
      grouped ? 'Gruppespil' : 'Grundspil – alle mod alle',
      `Tryk på en kamp for at indtaste resultatet. Hver kamp spilles til ${state.raceTo} vundne frames.`);
    state.rounds.forEach((r, i) => {
      const rDone = r.matches.every(isDone);
      let body;
      if (grouped) {
        body = state.groups.map(g => {
          const ms = r.matches.filter(m => m.group === g.name);
          return ms.length ? `<div class="group-label">Gruppe ${g.name}</div>${ms.map(m => matchRow(m, state.raceTo)).join('')}` : '';
        }).join('');
      } else {
        body = r.matches.map(m => matchRow(m, state.raceTo)).join('');
      }
      html += `<div class="card">
        <div class="round-title"><h2 style="margin:0 0 6px">Runde ${i + 1}</h2>${rDone ? '<span class="done-badge">✓ Færdig</span>' : ''}</div>
        ${body}
        ${r.byes.length ? `<div class="bye">Sidder over: <strong>${r.byes.map(id => esc(playerName(id))).join(', ')}</strong> (henter øl 🍺)</div>` : ''}
      </div>`;
    });
    return html;
  }

  function tableHtml(ids, cut) {
    const rows = standings(ids).map((r, i) => `<tr class="${i < cut ? 'top4' : ''}">
      <td class="pos">${i + 1}</td>
      <td class="name"><strong>${esc(r.name)}</strong></td>
      <td>${r.p}</td>
      <td>${r.w}</td>
      <td>${r.l}</td>
      <td class="hide-sm">${r.ff}-${r.fa}</td>
      <td>${r.diff > 0 ? '+' : ''}${r.diff}</td>
      <td class="pts">${r.pts}</td>
      <td class="hide-sm"><span class="form">${r.form.slice(-5).map(f => `<i class="${f}">${f === 'W' ? 'V' : 'T'}</i>`).join('')}</span></td>
    </tr>`).join('');
    return `<div class="card">
      <table>
        <thead><tr>
          <th>#</th><th class="name">Spiller</th><th title="Kampe">K</th><th title="Vundne">V</th><th title="Tabte">T</th>
          <th class="hide-sm" title="Frames vundet-tabt">Frames</th><th title="Frame-difference">+/-</th><th title="Point">P</th><th class="hide-sm">Form</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }

  function renderTable() {
    const rules = `Sejr = ${state.pointsPerWin} point. Ved pointlighed afgøres placeringen af frame-difference, derefter flest vundne frames, derefter indbyrdes opgør.`;
    if (state.mode === 'groups') {
      const cut = state.playoffSize / 2;
      return state.groups.map(g => `<h2>Gruppe ${g.name}</h2>${tableHtml(g.players, cut)}`).join('') +
        `<div class="muted small">${rules} De ${cut === 1 ? 'bedste' : `${cut} bedste`} fra hver gruppe (markeret med gult) går videre til slutspillet.</div>` +
        state.groups.map(g => renderMatrix(g.players, `Gruppe ${g.name} – alle resultater`)).join('');
    }
    return tableHtml(allIds(), state.playoffSize) +
      `<div class="muted small">${rules} ${state.playoffSize ? `De ${state.playoffSize} bedste (markeret med gult) går videre til slutspillet.` : ''}</div>` +
      renderMatrix(allIds(), 'Alle mod alle');
  }

  function renderMatrix(ids, title) {
    const ps = state.players.filter(p => ids.includes(p.id));
    const res = {};
    allLeagueMatches().forEach(m => {
      if (!isDone(m)) return;
      res[m.a + '|' + m.b] = [m.sa, m.sb];
      res[m.b + '|' + m.a] = [m.sb, m.sa];
    });
    const short = n => esc(n.length > 4 ? n.slice(0, 3) + '.' : n);
    return `<h2>${esc(title)}</h2>
    <div class="card" style="overflow-x:auto">
      <table class="small">
        <thead><tr><th></th>${ps.map(p => `<th title="${esc(p.name)}">${short(p.name)}</th>`).join('')}</tr></thead>
        <tbody>${ps.map(p => `<tr><td class="name"><strong>${esc(p.name)}</strong></td>${ps.map(q => {
          if (p.id === q.id) return '<td class="muted">—</td>';
          const r = res[p.id + '|' + q.id];
          if (!r) return '<td class="muted">·</td>';
          return `<td style="color:${r[0] > r[1] ? 'var(--win)' : 'var(--loss)'};font-weight:700">${r[0]}-${r[1]}</td>`;
        }).join('')}</tr>`).join('')}</tbody>
      </table>
    </div>`;
  }

  function bracketHtml() {
    const br = state.bracket;
    const total = br.rounds.length;
    let html = '<div class="bracket">';
    br.rounds.forEach((ms, r) => {
      const isFinal = r === total - 1;
      html += `<div class="card" ${isFinal ? 'style="border:1px solid var(--accent)"' : ''}>
        <div class="bm-label">${isFinal ? '🏆 ' : ''}${roundLabel(r, total)} · race to ${raceFor(r, total)}</div>
        ${ms.map(m => matchRow(m, raceFor(r, total))).join('')}
      </div>`;
    });
    if (br.bronze) html += `<div class="card"><div class="bm-label">🥉 Bronzekamp · race to ${state.playoffRaceTo}</div>${matchRow(br.bronze, state.playoffRaceTo)}</div>`;
    html += '</div>';
    const final = br.rounds[total - 1][0];
    const champ = winnerOf(final);
    if (champ) {
      const runnerUp = loserOf(final);
      const third = br.bronze ? winnerOf(br.bronze) : null;
      html += championCard({ name: playerName(champ) }, true, runnerUp && playerName(runnerUp), third && playerName(third));
    }
    return html;
  }

  function renderKnockout() {
    return progressCard('Knockout', 'Tryk på en kamp for at indtaste resultatet. Vinderen går videre til næste runde.') + bracketHtml();
  }

  function renderPlayoff() {
    const { done, total } = progress();
    if (!state.playoffSize) {
      return `<div class="card">Slutspil er slået fra. Vinderen af grundspillet er mester:</div>${championCard(standings()[0], done === total)}`;
    }
    if (!state.bracket) {
      const ready = done === total;
      const groups = state.mode === 'groups';
      const desc = state.playoffSize === 4
        ? (groups
          ? 'De 2 bedste fra hver gruppe går videre: A1 mod B2 og B1 mod A2 i semifinalerne, og vinderne mødes i finalen.'
          : 'De 4 bedste fra grundspillet går videre: 1 mod 4 og 2 mod 3 i semifinalerne, og vinderne mødes i finalen.')
        : (groups ? 'Gruppevinderne mødes i en finale.' : 'De 2 bedste fra grundspillet mødes i en finale.');
      return `<div class="card">
        <h2 style="margin-top:0">Slutspil</h2>
        <p class="muted">${desc}</p>
        <p class="muted small">${state.playoffSize === 4 ? `Semifinaler: race to ${state.playoffRaceTo} · ` : ''}Finale: race to ${state.finalRaceTo}</p>
        ${ready ? '' : `<p class="small" style="color:var(--accent)">${groups ? 'Gruppespillet' : 'Grundspillet'} er ikke færdigt endnu (${done}/${total}). Du kan stadig starte slutspillet ud fra den nuværende stilling.</p>`}
        <button class="btn" data-action="start-playoff">Start slutspil</button>
      </div>`;
    }
    return bracketHtml() + `<div style="margin-top:16px"><button class="btn secondary" data-action="reset-playoff">Nulstil slutspil</button></div>`;
  }

  function championCard(row, final, second, third) {
    if (!row) return '';
    return `<div class="champion" style="margin-top:12px">
      <div class="trophy">🏆</div>
      <div class="muted small">${final ? 'Turneringens mester' : 'Fører lige nu'}</div>
      <div class="who">${esc(row.name)}</div>
      ${second ? `<div class="small" style="margin-top:8px">🥈 ${esc(second)}${third ? ` &nbsp; 🥉 ${esc(third)}` : ''}</div>` : ''}
    </div>`;
  }

  function renderSetup() {
    if (state) {
      return `<div class="card">
        <h2 style="margin-top:0">Turnering i gang</h2>
        <p class="muted small">Spilform: <strong>${MODES[state.mode].name}</strong></p>
        <label for="renName">Navn på turneringen</label>
        <input type="text" id="renName" value="${esc(state.name)}">
        <label>Spillernavne (kan rettes uden at nulstille)</label>
        <div class="players-input">${state.players.map(p => `<input type="text" data-rename="${p.id}" value="${esc(p.name)}">`).join('')}</div>
        <div class="row" style="margin-top:12px"><button class="btn" data-action="save-names">Gem navne</button></div>
      </div>
      <div class="card">
        <h2 style="margin-top:0">Backup</h2>
        <p class="muted small">Data gemmes kun i denne browser. Eksportér en fil, hvis I vil flytte turneringen til en anden telefon.</p>
        <div class="row">
          <button class="btn secondary" data-action="export">Eksportér</button>
          <button class="btn secondary" data-action="import">Importér</button>
        </div>
      </div>
      <div class="card">
        <h2 style="margin-top:0">Ny turnering</h2>
        <p class="muted small">Sletter alle resultater og starter forfra – her kan I også vælge en anden spilform.</p>
        <button class="btn danger" data-action="reset-all">Slet og start forfra</button>
      </div>`;
    }
    const opts = (vals, sel, fmt = n => n) => vals.map(n => `<option value="${n}" ${n === sel ? 'selected' : ''}>${fmt(n)}</option>`).join('');
    return `<div class="card">
      <h2 style="margin-top:0">Opret turnering</h2>
      <label for="tName">Navn</label>
      <input type="text" id="tName" value="Pool-turnering">
      <label>Spillere</label>
      <div class="players-input" id="playerInputs">
        ${DEFAULT_NAMES.map((n, i) => playerInput(n, i)).join('')}
      </div>
      <div class="row" style="margin-top:8px"><button class="btn secondary" data-action="add-player">+ Tilføj spiller</button></div>

      <h2>Spilform</h2>
      <div class="modes">
        ${Object.entries(MODES).map(([k, m]) => `<label class="mode-opt" data-mode-opt="${k}">
          <input type="radio" name="mode" value="${k}" ${k === 'league' ? 'checked' : ''}>
          <span class="t">${m.name}</span>
          <span class="n" data-count="${k}"></span>
          <span class="d">${m.desc}</span>
        </label>`).join('')}
      </div>

      <h2>Regler</h2>
      <div class="row" style="align-items:flex-start">
        <div style="flex:1;min-width:140px">
          <label for="raceTo" id="raceToLabel">Grundspil: race to</label>
          <select id="raceTo">${opts([1, 2, 3, 4, 5, 6, 7], 3, n => `${n} (bedst af ${2 * n - 1})`)}</select>
        </div>
        <div style="flex:1;min-width:140px" id="ppwWrap">
          <label for="ppw">Point for sejr</label>
          <select id="ppw">${opts([1, 2, 3], 2)}</select>
        </div>
      </div>
      <div id="poSizeWrap">
        <label for="poSize">Slutspil</label>
        <select id="poSize">
          <option value="4" selected>Top 4: semifinaler + finale</option>
          <option value="2">Top 2: kun finale</option>
          <option value="0">Intet slutspil – vinderen af grundspillet vinder</option>
        </select>
      </div>
      <div class="row" style="align-items:flex-start">
        <div style="flex:1;min-width:140px">
          <label for="poRace">Semifinaler: race to</label>
          <select id="poRace">${opts([1, 2, 3, 4, 5, 6, 7], 4)}</select>
        </div>
        <div style="flex:1;min-width:140px">
          <label for="finRace">Finale: race to</label>
          <select id="finRace">${opts([1, 2, 3, 4, 5, 6, 7, 8, 9], 5)}</select>
        </div>
      </div>
      <label style="display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--text)">
        <input type="checkbox" id="bronze" checked> Bronzekamp om 3. pladsen
      </label>
      <div class="summary" id="setupSummary"></div>
      <div style="margin-top:18px"><button class="btn" data-action="create">Lav kampprogram</button></div>
    </div>
    <div class="card">
      <div class="row"><button class="btn secondary" data-action="import">Importér backup</button></div>
    </div>`;
  }

  function playerInput(name, i) {
    return `<div class="row"><input type="text" class="pname" placeholder="Spiller ${i + 1}" value="${esc(name)}"><button class="icon-btn" data-action="remove-player" title="Fjern">✕</button></div>`;
  }

  // Keep the setup form consistent with the chosen mode and show how many matches it gives.
  function updateSetup() {
    if (state || !$('#setupSummary')) return;
    const n = [...document.querySelectorAll('.pname')].filter(i => i.value.trim()).length || document.querySelectorAll('.pname').length;
    const groupsOk = n >= 4;
    const groupsOpt = $('[data-mode-opt=groups]');
    groupsOpt.classList.toggle('disabled', !groupsOk);
    groupsOpt.querySelector('input').disabled = !groupsOk;
    let mode = $('input[name=mode]:checked').value;
    if (mode === 'groups' && !groupsOk) { $('input[value=league]').checked = true; mode = 'league'; }

    const poSel = $('#poSize');
    const noneOpt = poSel.querySelector('option[value="0"]');
    noneOpt.disabled = mode === 'groups';
    if (mode === 'groups' && poSel.value === '0') poSel.value = '4';
    $('#poSizeWrap').style.display = mode === 'knockout' ? 'none' : '';
    $('#ppwWrap').style.display = mode === 'knockout' ? 'none' : '';
    $('#raceToLabel').textContent = mode === 'knockout' ? 'Første runder: race to' : mode === 'groups' ? 'Gruppekampe: race to' : 'Grundspil: race to';

    const size = +poSel.value, bronze = $('#bronze').checked;
    Object.keys(MODES).forEach(k => {
      $(`[data-count=${k}]`).textContent = `${plan(k, n, k === 'groups' && size === 0 ? 4 : size, bronze).total} kampe`;
    });
    const p = plan(mode, n, size, bronze);
    $('#setupSummary').innerHTML = `<strong>${n} spillere · ${p.total} kampe i alt.</strong> ${p.text}`;
  }

  // ---------- Actions ----------
  function createTournament() {
    const names = [...document.querySelectorAll('.pname')].map(i => i.value.trim()).filter(Boolean);
    if (names.length < 3) return toast('I skal være mindst 3 spillere');
    const lower = names.map(n => n.toLowerCase());
    if (new Set(lower).size !== lower.length) return toast('To spillere har samme navn');
    const mode = $('input[name=mode]:checked').value;
    if (mode === 'groups' && names.length < 4) return toast('Gruppespil kræver mindst 4 spillere');
    const players = names.map(name => ({ id: uid(), name }));
    const ids = players.map(p => p.id);
    let playoffSize = mode === 'knockout' ? 0 : +$('#poSize').value;
    if (playoffSize > players.length) playoffSize = 2;
    state = {
      name: $('#tName').value.trim() || 'Pool-turnering',
      mode,
      players,
      raceTo: +$('#raceTo').value,
      pointsPerWin: +$('#ppw').value,
      playoffSize,
      playoffRaceTo: +$('#poRace').value,
      finalRaceTo: +$('#finRace').value,
      bronzeMatch: $('#bronze').checked,
      rounds: [],
      groups: null,
      bracket: null,
      created: new Date().toISOString(),
    };
    if (mode === 'league') state.rounds = makeSchedule(ids);
    else if (mode === 'groups') Object.assign(state, makeGroups(ids));
    else { state.bracket = makeKnockout(ids, state.bronzeMatch); syncBracket(); }
    save();
    tab = 'program';
    render();
    toast('Kampprogram lavet – god fornøjelse! 🎱');
  }

  document.addEventListener('input', updateSetup);
  document.addEventListener('change', updateSetup);

  document.addEventListener('click', e => {
    const t = e.target.closest('[data-tab],[data-action],[data-match]');
    if (!t) return;
    if (t.dataset.tab) { tab = t.dataset.tab; render(); window.scrollTo(0, 0); return; }
    if (t.dataset.match) return openScore(t.dataset.match);
    switch (t.dataset.action) {
      case 'add-player': {
        const wrap = $('#playerInputs');
        wrap.insertAdjacentHTML('beforeend', playerInput('', wrap.children.length));
        wrap.lastElementChild.querySelector('input').focus();
        updateSetup();
        break;
      }
      case 'remove-player':
        t.closest('.row').remove();
        updateSetup();
        break;
      case 'create': createTournament(); break;
      case 'save-names': {
        const names = [...document.querySelectorAll('[data-rename]')].map(i => i.value.trim());
        if (names.some(n => !n)) return toast('Navne må ikke være tomme');
        document.querySelectorAll('[data-rename]').forEach(i => {
          const p = state.players.find(p => p.id === i.dataset.rename);
          if (p) p.name = i.value.trim();
        });
        state.name = $('#renName').value.trim() || state.name;
        save(); render(); toast('Gemt');
        break;
      }
      case 'start-playoff': createPlayoff(); save(); render(); break;
      case 'reset-playoff':
        if (confirm('Slette slutspillet og alle dets resultater?')) { state.bracket = null; save(); render(); }
        break;
      case 'reset-all':
        if (confirm('Er I sikre? Alle resultater slettes.')) {
          state = null;
          try { localStorage.removeItem(STORAGE_KEY); } catch {}
          tab = 'setup'; render();
        }
        break;
      case 'export': exportData(); break;
      case 'import': $('#importFile').click(); break;
    }
  });

  function exportData() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `pool-turnering-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  $('#importFile').addEventListener('change', async e => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!Array.isArray(data.players) || !Array.isArray(data.rounds)) throw new Error();
      if (state && !confirm('Erstatte den nuværende turnering med backup-filen?')) return;
      state = migrate(data); save(); tab = 'program'; render(); toast('Backup indlæst');
    } catch { toast('Ugyldig fil'); }
  });

  // ---------- Score dialog ----------
  const dlg = $('#scoreDialog');
  let editing = null; // { m, raceTo, a, b, league }

  function openScore(id) {
    const found = findMatch(id);
    if (!found) return;
    const { m, raceTo, ctx, league } = found;
    editing = { m, raceTo, league, a: m.sa ?? 0, b: m.sb ?? 0 };
    $('#dlgTitle').textContent = `${playerName(m.a)} vs ${playerName(m.b)}`;
    $('#dlgSub').textContent = `${ctx} · først til ${raceTo} frames`;
    $('#nmA').textContent = playerName(m.a);
    $('#nmB').textContent = playerName(m.b);
    $('#dlgClear').style.visibility = isDone(m) ? 'visible' : 'hidden';
    updateDialog();
    dlg.showModal();
  }

  function validScore(a, b, raceTo) {
    return (a === raceTo && b < raceTo) || (b === raceTo && a < raceTo);
  }

  function updateDialog() {
    const { a, b, raceTo, m } = editing;
    $('#valA').textContent = a;
    $('#valB').textContent = b;
    $('#sideA').classList.toggle('leading', a > b);
    $('#sideB').classList.toggle('leading', b > a);
    const ok = validScore(a, b, raceTo);
    $('#dlgSave').disabled = !ok;
    $('#dlgHint').textContent = ok
      ? `${playerName(a > b ? m.a : m.b)} vinder ${Math.max(a, b)}-${Math.min(a, b)}`
      : `En spiller skal have ${raceTo} frames.`;
  }

  dlg.addEventListener('click', e => {
    const btn = e.target.closest('[data-side]');
    if (btn) {
      const k = btn.dataset.side;
      editing[k] = Math.max(0, Math.min(editing.raceTo, editing[k] + +btn.dataset.d));
      // Only one player can reach the race target.
      const other = k === 'a' ? 'b' : 'a';
      if (editing[k] === editing.raceTo && editing[other] === editing.raceTo) editing[other] = editing.raceTo - 1;
      updateDialog();
      return;
    }
    if (e.target === dlg) dlg.close(); // click on backdrop
  });

  $('#dlgCancel').addEventListener('click', () => dlg.close());
  $('#dlgSave').addEventListener('click', () => {
    const { m, a, b, raceTo, league } = editing;
    if (!validScore(a, b, raceTo)) return;
    m.sa = a; m.sb = b;
    syncBracket(); save(); dlg.close(); render();
    const { done, total } = progress();
    if (league && done === total && state.playoffSize && !state.bracket) {
      toast('Indledende kampe færdige – start slutspillet! 🏆');
    } else toast('Resultat gemt');
  });
  $('#dlgClear').addEventListener('click', () => {
    if (!confirm('Fjerne resultatet for denne kamp?')) return;
    editing.m.sa = null; editing.m.sb = null;
    syncBracket(); save(); dlg.close(); render();
  });

  render();
})();
</script>
</body>
